<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioAI Engine | Authentication</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="index.html" class="navbar-brand fw-bold d-inline-flex align-items-center gap-2 mb-2 text-decoration-none">
                <i class="bi bi-magic fs-2 text-primary"></i> <span class="gradient-title fs-3">StudioAI Engine</span>
            </a>
            <p class="text-secondary small">Access the Enterprise Generative AI Suite</p>
        </div>

        <div class="card p-4 shadow-lg">
            <h4 class="fw-bold mb-3 text-center text-white" id="page-auth-title">Sign In</h4>
            
            <form id="standaloneAuthForm" onsubmit="executeAuthentication(event)">
                <div class="mb-3" id="signup-name-field" style="display: none;">
                    <label class="form-label small text-secondary">Full Name</label>
                    <input type="text" id="auth_full_name" class="form-control" placeholder="Suraj Gupta">
                </div>

                <div class="mb-3">
                    <label class="form-label small text-secondary">Email Address</label>
                    <input type="email" id="auth_email_address" class="form-control" placeholder="user@studioai.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small text-secondary">Password</label>
                    <input type="password" id="auth_user_password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mb-3" id="auth-submit-btn">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="text-center border-top border-secondary pt-3 mt-2">
              <!--  <small class="text-muted" id="auth-switch-text">Don't have an account? 
                    <a href="#" onclick="toggleAuthView()" class="text-primary text-decoration-none fw-bold">Sign Up</a>
                </small> -->
                <small class="auth-prompt-text" id="auth-switch-text">
  Don't have an account? 
  <a href="#" id="auth-switch-link" class="auth-prompt-link">Sign Up</a>
</small>
            </div>
        </div>
        
        <div class="text-center mt-3">
          <a href="index.html" class="back-studio-link text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Studio Engine</a>
        </div>
    </div>

<script>
    let isSignUpMode = false;

    function toggleAuthView() {
        isSignUpMode = !isSignUpMode;
        
        // Toggle UI fields
        document.getElementById('signup-name-field').style.display = isSignUpMode ? 'block' : 'none';
        document.getElementById('page-auth-title').innerText = isSignUpMode ? 'Create Account' : 'Sign In';
        document.getElementById('auth-submit-btn').innerHTML = isSignUpMode 
            ? '<i class="bi bi-person-plus me-1"></i> Register Account' 
            : '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
        
        document.getElementById('auth-switch-text').innerHTML = isSignUpMode 
            ? 'Already have an account? <a href="#" onclick="toggleAuthView()" class="text-primary text-decoration-none fw-bold">Sign In</a>'
            : 'Don\'t have an account? <a href="#" onclick="toggleAuthView()" class="text-primary text-decoration-none fw-bold">Sign Up</a>';
    }

    async function executeAuthentication(event) {
        event.preventDefault();
        
        const email = document.getElementById('auth_email_address').value.trim();
        const password = document.getElementById('auth_user_password').value.trim();
        const username = document.getElementById('auth_full_name') ? document.getElementById('auth_full_name').value.trim() : '';
        
        const API_BASE = "http://127.0.0.1:8000";
        const endpoint = isSignUpMode ? `${API_BASE}/register` : `${API_BASE}/login`;
        
        const payload = isSignUpMode 
            ? { username: username || email.split('@')[0], email: email, password: password }
            : { email: email, password: password };

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (!response.ok) {
                // Show exact error message from backend
                alert(result.detail || "Authentication failed.");
                return;
            }

            if (isSignUpMode) {
                alert("Account created successfully! Please sign in with your credentials.");
                toggleAuthView();
            } else {
                // Save JWT bearer token and user email for session verification
                sessionStorage.setItem('access_token', result.access_token);
                sessionStorage.setItem('active_user_email', result.user.email);
                
                // Redirect to main dashboard
                window.location.href = 'index.html';
            }

        } catch (err) {
            console.error("Auth Error:", err);
            alert("Unable to reach backend server. Ensure FastAPI is running on port 8000.");
        }
    }
</script>
</body>
</html>
